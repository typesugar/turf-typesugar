packages:
  - "packages/*"
  - "test/*"
  # case-study tooling: depends on the vendored typesugar tarballs, kept out of
  # the root package so adding it leaves every Turf resolution in the lockfile alone.
  - "case-study"

catalog:
  "@types/benchmark": ^2.1.5
  "@types/geojson": ^7946.0.10
  "@types/tape": ^5.8.1
  benchmark: ^2.1.4
  tape: ^5.10.2
  tslib: ^2.8.1
  tstyche: ^6.2.0
  tsup: ^8.5.1
  tsx: ^4.22.4
  typescript: ^5.9.3

overrides:
  # we do not use the vue capabilities of documentation, so remove this optional dependency
  # which has a (false positive) CVE associated with it
  "documentation>vue-template-compiler": "-"
  # typesugar case study: every typesugar package resolves to the vendored
  # tarball (see vendor/typesugar/README.md), never to the registry.
  typesugar: "file:vendor/typesugar/typesugar-0.1.1-be4286d3.tgz"
  unplugin-typesugar: "file:vendor/typesugar/unplugin-typesugar-0.1.1-be4286d3.tgz"
  "@typesugar/core": "file:vendor/typesugar/typesugar-core-0.1.1-be4286d3.tgz"
  "@typesugar/macros": "file:vendor/typesugar/typesugar-macros-0.1.1-be4286d3.tgz"
  "@typesugar/transformer": "file:vendor/typesugar/typesugar-transformer-0.1.1-be4286d3.tgz"
  "@typesugar/transformer-core": "file:vendor/typesugar/typesugar-transformer-core-0.1.1-be4286d3.tgz"
  "@typesugar/lsp-common": "file:vendor/typesugar/typesugar-lsp-common-0.1.1-be4286d3.tgz"
  "@typesugar/reflect": "file:vendor/typesugar/typesugar-reflect-0.1.1-be4286d3.tgz"
  "@typesugar/derive": "file:vendor/typesugar/typesugar-derive-0.1.1-be4286d3.tgz"
  "@typesugar/typeclass": "file:vendor/typesugar/typesugar-typeclass-0.1.1-be4286d3.tgz"
  "@typesugar/type-system": "file:vendor/typesugar/typesugar-type-system-0.1.1-be4286d3.tgz"
  "@typesugar/std": "file:vendor/typesugar/typesugar-std-0.1.1-be4286d3.tgz"
  "@typesugar/fp": "file:vendor/typesugar/typesugar-fp-0.1.1-be4286d3.tgz"
  "@typesugar/contracts": "file:vendor/typesugar/typesugar-contracts-0.1.1-be4286d3.tgz"
  "@typesugar/validate": "file:vendor/typesugar/typesugar-validate-0.1.1-be4286d3.tgz"
